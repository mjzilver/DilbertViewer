[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dilbert-downloader"
version = "0.1.0"
description = "Dilbert downloader"
requires-python = ">=3.8"
dependencies = [
    "httpx[socks]>=0.24",
	"beautifulsoup4>=4.12",
	"aiosqlite>=0.18",
	"aiofiles>=25.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
	"black",
	"pyinstaller"
]
